# TYPE  DATABASE  USER  ADDRESS      METHOD
#
# Unix socket — only containers that mount the postgres_socket volume can reach this.
# Used exclusively by db-password-sync to rotate passwords without needing the old one.
local   all       all               trust

# TCP — all other services (backend, db-init) and external tools (DBeaver).
# Password always required. Remove the port mapping in production to block external access.
host    all       all   0.0.0.0/0   scram-sha-256
