# =============================================================================
# Ephemeral Jest integration stack.
#
# Every value below is a throwaway fixture, NOT a secret: the database runs on
# tmpfs, the stack is destroyed when the run ends, and nothing here is reachable
# from outside the host running it. They are inlined on purpose. Anchors keep
# the repeated fixtures in one place.
#
# Only .env.defaults is loaded from disk; it is committed, so it always exists.
# =============================================================================

# Applied to every service. `environment:` outranks `env_file:`, so merging this
# block everywhere is what keeps the development values out of the test stack.
x-test-environment: &test-environment
    NODE_ENV: test

    POSTGRES_DB: propheta
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: test123

    DB_HOST: db-test
    DB_PORT: 5432
    DB_NAME: propheta
    DB_PASSWORD: test123
    DB_POOL_MAX: 30

    REDIS_HOST: redis-test
    REDIS_PORT: 6379
    REDIS_PASSWORD: test123

    SECRET_KEY: test_secret_key
    SALT_ROUNDS: 10
    # Matches database/init/sql/seed/auth_admin.sql — demo/test-only, not a secret.
    ADMIN_EMAIL: admin@propheta.test
    ADMIN_PASSWORD: test_admin_password

    BACKEND_URL: http://backend-test:5000

    X_API_BASE_URL: http://x-api-mock-test:4100
    X_WEBHOOK_CONSUMER_SECRET: test_webhook_consumer_secret
    X_BEARER_TOKEN: test_bearer_token
    X_WEBHOOK_TARGET_URL: http://backend-test:5000/api/webhooks/x
    DRY_RUN: "true"

services:
    db-test:
        image: postgres:16
        env_file:
            - ../../.env.defaults
        environment:
            <<: *test-environment
        command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
        tmpfs:
            - /var/lib/postgresql/data
        volumes:
            - ../../database/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - test-network

    db-init-test:
        build: ../../database/init
        restart: "no"
        env_file:
            - ../../.env.defaults
        depends_on:
            db-test:
                condition: service_healthy
        networks:
            - test-network
        environment:
            <<: *test-environment
        command: ["init"]

    db-seed-test:
        build: ../../database/init
        restart: "no"
        env_file:
            - ../../.env.defaults
        depends_on:
            db-init-test:
                condition: service_completed_successfully
        networks:
            - test-network
        environment:
            <<: *test-environment
        command: ["seed"]

    redis-test:
        image: redis:7
        env_file:
            - ../../.env.defaults
        environment:
            <<: *test-environment
        command: ["redis-server", "--requirepass", "test123"]
        networks:
            - test-network

    x-api-mock-test:
        build: ../../mocks/x-api-mock
        env_file:
            - ../../.env.defaults
        environment:
            <<: *test-environment
            PORT: 4100
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/health || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 10s
        networks:
            - test-network

    backend-test:
        build: ../../backend
        env_file:
            - ../../.env.defaults
        depends_on:
            db-seed-test:
                condition: service_completed_successfully
            redis-test:
                condition: service_started
            x-api-mock-test:
                condition: service_healthy
        environment:
            <<: *test-environment
            PORT: 5000
            DB_USER: app_user
            TIME_ACCESS_TOKEN_LAST: 15m
            TIME_REFRESH_TOKEN_LAST: 7d
            CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'node -e "require(''http'').get(''http://localhost:5000/api/health'', r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"'
                ]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 15s
        networks:
            - test-network

    tests:
        build: .
        env_file:
            - ../../.env.defaults
        depends_on:
            backend-test:
                condition: service_healthy
        environment:
            <<: *test-environment
        networks:
            - test-network

networks:
    test-network:
        driver: bridge
