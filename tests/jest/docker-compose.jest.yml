    KALSHI_TIMEOUT_MS: 10000

    TRADE_MIN_CONFIDENCE: 0.6
    MAX_SPREAD_CENTS: 4
    MAX_SLIPPAGE_CENTS: 10
    MIN_NET_EDGE_CENTS: 2
    MAX_TRADE_EXPOSURE_PCT: 2
    MAX_TOPIC_EXPOSURE_PCT: 5
    MAX_DAILY_LOSS_PCT: 5
    # A run opens several simulated positions within seconds (happy path, the
    # first realDonaldTrump post, four exit scenarios); the production default
    # of 3 would veto them as order_rate_limit depending on file order.
    MAX_ORDERS_PER_MINUTE: 50
    SELECTION_MAX_ITERATIONS: 2
    SELECTION_MAX_TOOL_CALLS: 6
    TRADE_NOVELTY_WINDOW_HOURS: 6
    # kalshi-mock's KXTEST series holds one market per scenario (10); every
    # one must stay a candidate so `[[ticker:...]]` markers can pick it.
    TRADE_MAX_CANDIDATES: 20
    TRADE_MIN_HORIZON_MINUTES: 5
    # Comfortably past the kalshi-mock fixture's 7-day close_time, so
    # candidate assembly's close-time filter never excludes it.
    TRADE_HORIZON_MINUTES: 20000
    # Above kalshi-mock's KXLOWVOL series (10) and below the others (5000), so
    # gate 2's no_liquid_market branch is reachable.
    TRADE_MIN_SERIES_VOLUME: 100
    TRADE_CAPITAL_BASE_CENTS: 100000
    QUOTE_POLL_ENABLED: "false"
    EXIT_SWEEP_INTERVAL_MS: 1000
    # The model's horizon wins outright and the floor sits below a minute, so
    # the time-limit exit test can force a ~6s deadline via `[[horizon:0.1]]`.
    # Every other test keeps the mocked 180-minute horizon.
    EXIT_HORIZON_MODEL_WEIGHT: 1
    EXIT_HORIZON_MIN_MINUTES: 0.05
    # Fast enough that the startup refresh plus one interval tick populate the
    # market cache well within a test's own timeout.
    MARKET_CACHE_REFRESH_MS: 2000

    DRY_RUN: "true"

services:
    db-test:
        image: postgres:16
        env_file:
            - ../../.env.defaults
        environment:
            <<: *test-environment
        command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
        tmpfs:
            - /var/lib/postgresql/data
        volumes:
            - ../../database/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - test-network

    db-init-test:
        build: ../../database/init
        restart: "no"
        env_file:
            - ../../.env.defaults
        depends_on:
            db-test:
                condition: service_healthy
        networks:
            - test-network
        environment:
            <<: *test-environment
        command: ["init"]

    db-seed-test:
        build: ../../database/init
        restart: "no"
        env_file:
            - ../../.env.defaults
        depends_on:
            db-init-test:
                condition: service_completed_successfully
        networks:
            - test-network
        environment:
            <<: *test-environment
        # Swaps the real series whitelist for one that only names kalshi-mock's
        # fixture series.
        volumes:
            - ./fixtures/trading_topic_series.sql:/app/sql/seed/trading_topic_series.sql:ro
        command: ["seed"]

    redis-test:
        image: redis:7
        env_file:
            - ../../.env.defaults
        environment:
            <<: *test-environment
        command: ["redis-server", "--requirepass", "test123"]
        networks:
            - test-network

    x-api-mock-test:
        build: ../../mocks/x-api-mock
        env_file:
            - ../../.env.defaults
        environment:
            <<: *test-environment
            PORT: 4100
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/health || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 10s
        networks:
            - test-network

    anthropic-mock-test:
        build: ../../mocks/anthropic-mock
        env_file:
            - ../../.env.defaults
        environment:
            <<: *test-environment
            PORT: 4200
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4200/health || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 10s
        networks:
            - test-network

    kalshi-mock-test:
        build: ../../mocks/kalshi-mock
        env_file:
            - ../../.env.defaults
        environment:
            <<: *test-environment
            PORT: 4300
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4300/health || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 10s
        networks:
            - test-network

    backend-test:
        build: ../../backend
        env_file:
            - ../../.env.defaults
        depends_on:
            db-seed-test:
                condition: service_completed_successfully
            redis-test:
                condition: service_started
            x-api-mock-test:
                condition: service_healthy
            anthropic-mock-test:
                condition: service_healthy
            kalshi-mock-test:
                condition: service_healthy
        environment:
            <<: *test-environment
            PORT: 5000
            DB_USER: app_user
            TIME_ACCESS_TOKEN_LAST: 15m
            TIME_REFRESH_TOKEN_LAST: 7d
            CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'node -e "require(''http'').get(''http://localhost:5000/api/health'', r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"'
                ]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 15s
        networks:
            - test-network

    tests:
        build: .
        env_file:
            - ../../.env.defaults
        depends_on:
            backend-test:
                condition: service_healthy
        environment:
            <<: *test-environment
        networks:
            - test-network

networks:
    test-network:
        driver: bridge
